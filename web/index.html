    <script>
      // Signed-in players, and old links with game options (?record=1, ?time=, ?bg=, ?judge=1),
      // go straight to the game at /play.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          // Invite link (?ref=<garden>): kept 7 days for the new garden (same JSON as src/referral.ts).
          var ref = (q.get('ref') || '').trim().toLowerCase();
          if (/^[a-z0-9][a-z0-9_-]{0,63}$/.test(ref)) localStorage.setItem('nearvest.ref', JSON.stringify({ ref: ref, at: Date.now() }));
          var game = ['record', 'time', 'bg', 'judge'].some(function (k) { return q.has(k); });
          if (game || localStorage.getItem('nearvest.token')) location.replace('/play' + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
    <script>
      // A page opened before a new deploy may ask for JS files that are gone: reload once
      // (same key and 60 s guard as src/chunk-reload.ts), never show the error.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || t.type !== 'module') return;
        try {
          var last = Number(sessionStorage.getItem('nearvest.chunkReload') || 0);
          if (last && Date.now() - last < 60000) return;
          sessionStorage.setItem('nearvest.chunkReload', String(Date.now()));
          location.reload();
        } catch (err) {}
      }, true);
    </script>
